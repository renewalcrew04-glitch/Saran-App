name: saran_app
description: SARAN App - A social wellness application built with Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  get: ^4.6.6

  # Networking
  http: ^1.1.0
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Authentication & Security
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.7

  # UI Components
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.0
  image_picker: ^1.0.5
  video_player: ^2.8.1
  photo_view: ^0.14.0

  # Navigation
  go_router: ^12.1.3

  # Location & Maps
  geolocator: ^11.0.0
  google_maps_flutter: ^2.5.3

  # Notifications
  flutter_local_notifications: ^16.3.0
  firebase_messaging: ^14.7.9

  # Media & Camera
  camera: ^0.10.5+9
  image: ^4.1.3
  path_provider: ^2.1.1
  permission_handler: ^11.1.0

  # Audio
  just_audio: ^0.9.36
  record: ^5.0.4
  audioplayers: ^5.2.1

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  package_info_plus: ^5.0.1
  device_info_plus: ^9.1.1

  # Animations
  flutter_animate: ^4.3.0
  lottie: ^3.1.0

  # Charts & Visualization
  fl_chart: ^0.66.0

  # WebSocket (for real-time)
  web_socket_channel: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
